name: CI

on:
  push:
    branches: ['reddit-app']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-fund
      - name: Typecheck
        run: npx tsc --build --pretty false
      - name: Lint
        if: always()
        run: |
          npx eslint 'src/**/*.{ts,tsx}' -f json -o eslint.json || true
          node -e "const r=require('./eslint.json');let n=0;for(const f of r)for(const m of f.messages){n++;console.log('::error file='+f.filePath.replace(process.cwd()+'/','')+',line='+(m.line||1)+'::'+(m.ruleId||'fatal')+': '+m.message.replace(/\n/g,' '))}process.exit(n?1:0)"
      - name: Unit tests
        if: always()
        run: npm run test:unit
      - name: Build
        if: always()
        run: npm run build
