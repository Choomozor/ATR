name: CI

on:
  push:
    branches: ['reddit-app']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-fund
      - name: Typecheck
        run: npx tsc --build --pretty false
      - name: Lint
        if: always()
        run: |
          npx eslint 'src/**/*.{ts,tsx}' -f json -o eslint.json || true
          node -e "const r=require('./eslint.json');let n=0;for(const f of r)for(const m of f.messages){n++;console.log('::error file='+f.filePath.replace(process.cwd()+'/','')+',line='+(m.line||1)+'::'+(m.ruleId||'fatal')+': '+m.message.replace(/\n/g,' '))}process.exit(n?1:0)"
      - name: Unit tests
        if: always()
        run: npm run test:unit
      - name: Build
        if: always()
        run: |
          npm run build
          echo "::notice::flag files in build: $(ls dist/client/assets | grep -c '\.svg$' || true)"
          echo "::notice::client assets: $(du -sh dist/client | cut -f1), server bundle: $(du -sh dist/server | cut -f1)"
          echo "::notice::client files: $(cd dist/client && find . -type f | head -20 | tr '\n' ' ')"
          echo "::notice::inlined svgs: $(grep -o 'data:image/svg+xml' -r dist/client | wc -l), fr.svg refs: $(grep -o '[^\"]*fr[-.a-zA-Z0-9_]*\.svg' -r dist/client --include=*.js | head -3 | tr '\n' ' ')"
          echo "::notice::flag-icons installed: $(ls node_modules/flag-icons/flags/4x3 2>/dev/null | wc -l)"
          echo "::notice::server files: $(cd dist/server && ls -la | tr '\n' ' ' | head -c 600)"
